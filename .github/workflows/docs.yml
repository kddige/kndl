# The docs site (packages/docs): built on pull requests that touch it or what it renders, and
# built and deployed to GitHub Pages on push to main. Pages must be set to deploy from GitHub
# Actions in the repository settings.
name: Docs

on:
  pull_request:
    paths: &docs-paths
      - "packages/docs/**"
      - "GLOSSARY.md"
      - "docs/adr/**"
      - "brand/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths: *docs-paths
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push supersedes a queued one, but a running deploy finishes.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install the docs package's dependencies
        run: bun install --frozen-lockfile --filter @kndl/docs
      - name: Type-check
        run: bun run --filter @kndl/docs typecheck
      - name: Build, and check every internal link and anchor
        run: bun run docs:build
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/docs/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
