# The checks every change must pass: type-check, lint, format and the unit tests, on pull requests
# (forks' included, so it uses no secrets) and on push to main. The tests that boot real
# microsandbox Sandboxes skip themselves without KNDL_SANDBOX_IT=1, so they don't run here. The
# release workflow calls it on a Release tag's commit.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes its running checks; main's run to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      # The durable agent's end-to-end test (packages/mod/durable/test/agent.e2e.spec.ts) runs the
      # built agent under Node and skips itself below 22.19. This is the Node.js a Runner pins
      # for Sessions (PinnedNodeVersion in packages/runner/src/sandbox/SandboxPi.ts).
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.22.0
      # No Claude Code binary is needed to build, type-check or run the offline tests. The
      # Runner's tmux tests skip themselves without tmux.
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install --yes tmux
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Check formatting
        run: bun run format:check
      - name: Test
        run: bun test
