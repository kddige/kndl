name: Feature
description: Something kndl should do.
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        kndl changes quickly, so a short discussion here before you build anything big saves a rewrite.
        Use the terms in [GLOSSARY.md](https://github.com/kddige/kndl/blob/main/GLOSSARY.md), and check [the ADRs](https://github.com/kddige/kndl/tree/main/docs/adr) for decisions near your idea.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What kndl could do about it. A sketch or mockup helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways around it, and why they fall short.
